name: release

# Publish stage: tag a v* (or trigger manually) → GitHub Release with
# per-target tarball/zip + per-archive sha256 + top-level SHA256SUMS.
#
# Splits cleanly with `build-and-test.yml`:
#   - push / pull_request → build-and-test.yml (auto-test stage)
#   - tag push / dispatch → THIS workflow (publish stage)
#
# The 6-target matrix is intentionally identical to build-and-test.yml
# (aarch64-windows gated with continue-on-error: true).
# The trade-off is that a tag push runs the matrix twice
# (here + in build-and-test.yml) ≈ +2 min — accepted for the simpler
# workflow_run-free model.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- main release matrix (tag + dispatch only) ----
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux-musl,   runner: ubuntu-latest,    os: linux,   libc: musl, docker_arch: amd64 }
          - { target: aarch64-linux-musl,  runner: ubuntu-24.04-arm, os: linux,   libc: musl, docker_arch: arm64 }
          - { target: aarch64-macos,       runner: macos-14,         os: macos                  }
          - { target: x86_64-macos,        runner: macos-14,         os: macos                  }
          - { target: x86_64-windows,      runner: windows-latest,   os: windows                }
          # aarch64-windows: MSYS2 MINGW64 doesn't ship mingw-w64-aarch64-gcc
          # as of 2026-07-15. continue-on-error so a missing toolchain
          # doesn't break the release.
          - { target: aarch64-windows,     runner: windows-11-arm,   os: windows                }
    # aarch64-windows: continue-on-error due to MSYS2 toolchain gap.
    # x86_64-windows: continue-on-error due to a known fio-on-MinGW
    # limitation (crc32c-arm64.c compiled on x86_64 Windows; see
    # AUDIT-2026-07-15.md and the matching build-and-test.yml comment).
    # The release job publishes when build is success OR failure so
    # v0.1.0 ships the 4 working targets (linux × 2, macos × 2).
    continue-on-error: ${{ matrix.target == 'aarch64-windows' || matrix.target == 'x86_64-windows' }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      # ---- install deps ----
      - name: Install deps (Linux)
        if: matrix.libc == 'musl'
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Install deps (macOS)
        if: matrix.os == 'macos'
        run: |
          brew update
          brew install bash

      - name: Install deps (Windows MSYS2 + mingw64)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            autoconf
            automake
            libtool
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib

      # ---- build ----
      - name: Build + smoke on Alpine (musl)
        if: matrix.libc == 'musl'
        run: docker run --rm --platform linux/${{ matrix.docker_arch }} -v "$PWD":/w -w /w alpine:3.20 sh -c 'apk add --no-cache bash >/dev/null && bash /w/scripts/build-alpine.sh && bash /w/scripts/smoke.sh'

      - name: Build (macOS — host)
        if: matrix.os == 'macos' && matrix.target == 'aarch64-macos'
        run: bash scripts/build.sh

      - name: Build (macOS x86_64 — cross from aarch64)
        if: matrix.target == 'x86_64-macos'
        env:
          FIO_TARGET_ARCH: x86_64
          FIO_OS_HINT: darwin
        run: bash scripts/build.sh

      - name: Build (Windows x86_64 — msys2 bash)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        env:
          FIO_OS_HINT: windows
        run: bash scripts/build.sh

      # ---- smoke ----
      - name: Smoke test on macOS
        if: matrix.os == 'macos'
        run: bash scripts/smoke.sh

      - name: Smoke test on Windows (informational)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        continue-on-error: true
        run: |
          set +e
          FIO="${{ github.workspace }}/build/fio.exe"
          ls -la "$FIO" || { echo "FAIL: binary missing"; exit 1; }
          "$FIO" --version 2>&1 | head -3 || true
          "$FIO" --enghelp 2>&1 | head -5 || true
          echo "OK: binary executes; round-trip smoke deferred."

      # ---- package ----
      - name: Package (Linux / macOS)
        if: matrix.os != 'windows'
        run: TARGET=${{ matrix.target }} bash scripts/package.sh

      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        env:
          TARGET: ${{ matrix.target }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1

      # ---- verify ----
      - name: Verify self-contained (Linux)
        if: matrix.os == 'linux'
        run: |
          set -e
          bin="dist/fio-${{ matrix.target }}/bin/fio"
          out="$(ldd "$bin" 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "not a dynamic executable" \
            || { echo "FAIL: not fully static"; exit 1; }

      - name: Verify self-contained (macOS)
        if: matrix.os == 'macos'
        run: |
          set -e
          bin="dist/fio-${{ matrix.target }}/bin/fio"
          otool -L "$bin"
          otool -L "$bin" | grep -E '/(opt/homebrew|usr/local)/' \
            && { echo "FAIL: $bin links Homebrew dylibs"; exit 1; } || true
          echo "OK: only system libs (/usr/lib, /System/Library)"

      - name: Show file type & size (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          file dist/fio-${{ matrix.target }}/bin/fio
          du -h dist/fio-${{ matrix.target }}.tar.gz

      - name: Show file type & size (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          file dist/fio-${{ matrix.target }}/bin/fio.exe
          Get-ChildItem dist/fio-${{ matrix.target }}.zip | Format-Table Name, Length

      # ---- upload artifact (used by the release job below) ----
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fio-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ---- publish on tag ----
  release:
    if: startsWith(github.ref, 'refs/tags/v') && (needs.build.result == 'success' || needs.build.result == 'failure')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          find . -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | xargs -0 sha256sum | sed 's|^\([^ ]*\)  \./|\1  |' > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS
          generate_release_notes: true