# Jekyll config for ljh-sh.github.io/fio (Pages source = /docs).
#
# We deliberately don't use a heavy theme — the site is hand-rolled HTML
# that already has its own styles.css + nav + nav-footer. We just need
# GitHub Pages to serve docs/ as a flat static site.
#
# Theme: minimal (built-in Pages theme; no JS tracking, no remote CSS).
# Markdown: keep raw — pages are all raw HTML for full control.
# Plugins: none (no jekyll-feed, no jekyll-seo-tag — they're not needed
# and they pull in third-party JS).

title: ljh-sh/fio
description: Self-contained multi-platform static builds of axboe/fio.
theme: jekyll-theme-minimal
markdown: kramdown
permalink: /:title.html

# Don't apply Jekyll's smarts to our raw HTML — leave everything as-is.
defaults:
  - scope:
      path: ""          # all files
    values:
      layout: null      # no Jekyll layout wrapping
      seo_tag: null

# We never want third-party assets leaking through. Pages-rendered output
# should only reference same-origin URLs.
safe: true